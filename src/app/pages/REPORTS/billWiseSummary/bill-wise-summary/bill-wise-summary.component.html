<div class="salary-grid-wrapper" style="padding: 0 10px">
  <div class="form-flex-wrapper">
    <div class="form-item">
      <dx-select-box
        [(value)]="selectedRange"
        [dataSource]="dateRanges"
        displayExpr="label"
        valueExpr="value"
        label="Date Range"
        labelMode="floating"
        [width]="200"
        (onValueChanged)="onDateRangeChange($event)"
      ></dx-select-box>
    </div>

    <div class="form-item">
      <dx-tag-box
        [items]="DepartmentData"
        valueExpr="Id"
        displayExpr="Description"
        label="Select Department"
        labelMode="floating"
        [(value)]="Departmens_value"
        [showSelectionControls]="true"
        [multiline]="false"
        [searchEnabled]="true"
        [width]="250"
      ></dx-tag-box>
    </div>

    <div class="form-item">
      <dx-tag-box
        [items]="staff_Data"
        valueExpr="Id"
        displayExpr="Description"
        label="Select Staff"
        labelMode="floating"
        [(value)]="staff_value"
        [showSelectionControls]="true"
        [multiline]="false"
        [searchEnabled]="true"
        [width]="200"
      ></dx-tag-box>
    </div>

    <div class="form-item applybtn">
      <dx-button
        text="Apply"
        type="default"
        icon="todo"
        stylingMode="contained"
        [width]="100"
        class="mt-2"
        (onClick)="get_DataSource()"
      ></dx-button>
    </div>
  </div>

  <div class="grid-container">
    <dx-data-grid 
    
      [dataSource]="billWiseSummaryData"
      width="100%"
      height="75vh"
      [showBorders]="true"
      [columnAutoWidth]="true"
      [wordWrapEnabled]="false"
      [rowAlternationEnabled]="true"
           [rowAlternationEnabled]="true"
      rowAlternationInterval="2"
      [allowColumnReordering]="true"
      [filterRow]="{ visible: false }"
       id="dataGrid"
      [headerFilter]="{ visible: false }"
      [columnFixing]="{
        enabled: true,
        texts: { fix: 'Freeze', unfix: 'Unfreeze' }
      }"
      (onExporting)="onExporting($event)"
      [summary]="summaryColumnsData"
     
      > 
      <!-- <dxo-filter-row [visible]="true"></dxo-filter-row> -->
       <dxo-header-filter [visible]="true">
      <dxo-search [enabled]="true"></dxo-search>
    </dxo-header-filter>
         <dxo-export [enabled]="true" [formats]="['xlsx', 'pdf']"> </dxo-export>
          <dxo-paging [pageSize]="10"></dxo-paging>
<dxo-pager
        [visible]="true"
        [allowedPageSizes]="allowedPageSizes"
        [displayMode]="displayMode"
        [showPageSizeSelector]="true"
        [showInfo]="true"
        [showNavigationButtons]="true"
      ></dxo-pager>
      <dxo-toolbar>
        <dxi-item location="before">
          <div class="grid-header " style="font-weight: 600 ;font-size: 20px; margin-left: 12px;">Bill Wise Summary</div>
        </dxi-item>
        <!-- <dxi-item
          location="after"
          locateInMenu="auto"
          showText="inMenu"

          [options]="{
            text: 'Refresh',
            icon: 'refresh',
            onClick: refresh,
            stylingMode: 'text',
            disabled: isEmptyDatagrid,
            hint: 'Refresh'
          }"
        ></dxi-item> -->

        <!-- <dxi-item
          widget="dxButton"
          [options]="{
            text: '',
            icon: 'filter',
            onClick: filterClick,
            disabled: isEmptyDatagrid,
            hint: 'Search Column'
          }"
        ></dxi-item> -->

        <!-- <dxi-item
          name="columnChooserButton"
          locateInMenu="auto"
          [disabled]="isEmptyDatagrid"
        ></dxi-item> -->


        <!-- <dxi-item
          widget="dxButton"
          [options]="{
            text: '',
            icon: 'formula',
            onClick: SummaryClick,
            hint: 'Hide/Show Summary',
            disabled: isEmptyDatagrid,
          }"
        ></dxi-item> -->

        <dxi-item name="exportButton" [disabled]="isEmptyDatagrid"></dxi-item>

        <!-- <dxi-item
          class="columnfinderclass"
          widget="dxDropDownButton"
          [options]="{
            dataSource: ColumnNames,
            onItemClick: findColumnLocation,
            placeholder: 'Search Column',
            noDataText: 'Load data and try again',
            disabled: isEmptyDatagrid,
            hint: 'Column location finder',
            icon:'columnproperties',
            dropDownOptions: {
              width: 'auto',
              height: '60vh'
            },

          }"
        ></dxi-item> -->
      </dxo-toolbar>
      
      <dxo-grouping
        [autoExpandAll]="false"
        [contextMenuEnabled]="true"
        [expandMode]="'rowClick'"
      ></dxo-grouping>
      <dxo-group-panel [visible]="true"></dxo-group-panel>
      <dxo-sorting mode="multiple"></dxo-sorting>
      
       <dxi-column
        dataField="DEPARTMENT_NAME"
        caption="Department Name"
        data-type="string"
        width="200"
        grouping="true"
      ></dxi-column>
    
      <dxi-column
        dataField="BillNo"
        caption="Bill No"
        data-type="string"
        grouping="true"
        width="100"
      ></dxi-column>
      <dxi-column
        dataField="InvoiceSl"
        caption="Invoice No"
        data-type="number"
         grouping="true"
        width="100"
      ></dxi-column>
      <dxi-column
        dataField="PatientName"
        caption="Patient Name"
        data-type="string"
         grouping="true"
        width="150"
      ></dxi-column>
      <dxi-column
        dataField="Uhid"
        caption="UHID"
         grouping="true"
        data-type="string"
        width="150"
      ></dxi-column>
      <dxi-column
        dataField="GrossAmt"
        caption="Gross Amount"
         grouping="true"
        data-type="number"
        [format]="{ type: 'fixedPoint', precision: 2, useGrouping: true }"
        width="120"
      ></dxi-column>
     
      <dxi-column
        dataField="SchemaAmt"
        caption="Scheme Amount"
        data-type="number"
        [format]="{ type: 'fixedPoint', precision: 2, useGrouping: true }"
        width="120"
      ></dxi-column>
       <dxi-column
        dataField="NetAmt"
        caption="Net Amount"
        data-type="number"
        [format]="{ type: 'fixedPoint', precision: 2, useGrouping: true }"
        width="120"
      ></dxi-column>
      <dxi-column
        dataField="Cash"
        caption="Cash"
        data-type="number"
        [format]="{ type: 'fixedPoint', precision: 2, useGrouping: true }"
        width="100"
      ></dxi-column>
      <dxi-column
        dataField="Credit"
        caption="Credit"
        data-type="number"
        [format]="{ type: 'fixedPoint', precision: 2, useGrouping: true }"
        width="100"
      ></dxi-column>
      <dxi-column
        dataField="Upi"
        caption="UPI"
        data-type="number"
   
        width="100"
      ></dxi-column>
    </dx-data-grid>
  </div>
</div>
<!-- =================header filter======================== -->
<dx-popup
  [(visible)]="isCustomDatePopupVisible"
  [width]="'300px'"
  title="Select Custom Date Range"
  [showCloseButton]="true"
  [dragEnabled]="false"
  [closeOnOutsideClick]="true"
  [height]="'300px'"
>
  <div class="p-3">
    <dx-date-box
      [(value)]="fromDate"
      type="date"
      displayFormat="yyyy-MM-dd"
      label="From Date"
    >
    </dx-date-box>

    <dx-date-box
      [(value)]="toDate"
      type="date"
      displayFormat="yyyy-MM-dd"
      label="To Date"
    >
    </dx-date-box>

    <button class="custom-apply-btn" (click)="applyCustomDate()">Apply</button>
  </div>
</dx-popup>
