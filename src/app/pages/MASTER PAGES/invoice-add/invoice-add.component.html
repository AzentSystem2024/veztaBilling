<dx-validation-group #invoiceFormGroup>
  <div
    id="invoiceToPrint"
    class="invoice-wrapper"
    style="
      height: 95vh;
      display: flex;
      flex-direction: column;

      box-sizing: border-box;
    "
  >
    <div class="salary-grid-wrapper" style="padding: 0 10px">
      <div class="grid-container">
        <dx-data-grid
          #itemsGridRef
          [dataSource]="invoiceFormData.INVOICE_ENTRY"
          [showBorders]="true"
          [columnAutoWidth]="false"
          [wordWrapEnabled]="false"
          [rowAlternationEnabled]="true"
          [headerFilter]="{ visible: true }"
          [allowColumnReordering]="true"
          [showColumnHeaders]="true"
          [columnAutoWidth]="true"
          [allowColumnResizing]="true"
          [height]="'70vh'"
          [columnResizingMode]="'nextColumn'"
          [headerFilter]="{ visible: true }"
          [scrolling]="{ mode: 'virtual' }"
          rowAlternationInterval="2"
          [selection]="{ mode: 'single' }"
     [editing]="{ mode: 'cell', allowUpdating: true }"
          (onEditorPreparing)="onEditorPreparing($event)"
          (onCellValueChanged)="onCellChanged($event)"
          (onContentReady)="onGridContentReady($event)"
          [editing]="{ mode: 'row', allowUpdating: true, allowDeleting: true, allowAdding: true, useIcons: true }"
          (onInitNewRow)="onInitNewRow($event)"
           (onRowRemoving)="onRowRemoving($event)"
           (onKeyDown)="handleGridKeyDown($event)"
           (onCellPrepared)="onCellPrepared($event)"
            (onRowValidating)="onRowValidating($event)"
        >
          <!-- <dxo-editing mode="row" [allowAdding]="true" [allowDeleting]="true"></dxo-editing> -->
          <dxo-load-panel [showPane]="false"></dxo-load-panel>
          <!-- <dxo-scrolling mode="standard"></dxo-scrolling> -->
          <dxo-filter-builder [allowHierarchicalFields]="true">
          </dxo-filter-builder>
          <dxo-toolbar>
            <dxi-item location="before" locateInMenu="auto">
              <div
                class="stacked-toolbar-group"
                style="display: flex; flex-direction: column; gap: 2px"
              >
                <!-- Date Field -->
                <dx-text-box
                  label="Date & Time"
                  labelMode="floating"
                  [value]="formattedInvoiceDate"
                  [width]="205"
                  [readOnly]="true"
                ></dx-text-box>

                <!-- Ward and Unit Row (Each half width of Date) -->
                <div style="display: flex; gap: 5px">
                 
                  <dx-autocomplete
                    #wardBoxRef
                    [dataSource]="wardOptions"
                    [minSearchLength]="0"
                    [searchExpr]="'NAME'"
                    [valueExpr]="'NAME'"
                    label="Ward"
                    labelMode="floating"
                    [(value)]="invoiceFormData.WARD"
                    [width]="100"
                    (onKeyDown)="onKeyDownHandler($event, 'unitBoxRef')"
                  ></dx-autocomplete>

               
                  <dx-autocomplete
                    #unitBoxRef
                    [dataSource]="unitOptions"
                    [minSearchLength]="0"
                    [searchExpr]="'NAME'"
                    [valueExpr]="'NAME'"
                    label="Unit"
                    labelMode="floating"
                    [(value)]="invoiceFormData.UNIT"
                    [width]="100"
                    (onKeyDown)="onKeyDownHandler($event, 'patientBoxRef')"
                  ></dx-autocomplete>
                </div>
              </div>
            </dxi-item>

            <dxi-item location="before" locateInMenu="auto">
              <div
                class="stacked-toolbar-group"
                style="display: flex; flex-direction: column; gap: 5px"
              >
                <!-- Row: Bill No. and Department -->
                <div style="display: flex; gap: 5px">
                  <!-- Bill No. -->
                  <dx-text-box
                    #billNoBoxRef
                    label="Bill No."
                    labelMode="floating"
                    [(value)]="invoiceFormData.INVOICE_NO"
                    [width]="300"
                    [readOnly]="true"
                    (onKeyDown)="onKeyDownHandler($event, 'wardBoxRef')"
                  ></dx-text-box>

                  <!-- ✅ Department Field -->
                  <!-- <dx-text-box
                    #departmentBoxRef
                    label="Department"
                    labelMode="floating"
                    [(value)]="departmentName"
                    [width]="200"
                    [readOnly]="true"
                    (onKeyDown)="onKeyDownHandler($event, 'patientBoxRef')"
                  ></dx-text-box> -->
                  <dx-select-box
  #departmentBoxRef
  [items]="departmentsForAdmin"
  displayExpr="DESCRIPTION"
  valueExpr="ID"
  [(value)]="selectedDepartmentId"
  [readOnly]="userData?.USER_TYPE_ID !== 1 && userData?.USER_TYPE_ID !== 2 && userData?.USER_TYPE_ID !== 3"
  [width]="200"
  placeholder="Select Department"
  [searchEnabled]="true"
  label="Department"
  labelMode="floating"
  (onKeyDown)="onKeyDownHandler($event, 'patientBoxRef')"
  (onValueChanged)="onDepartmentChanged($event)"
>
</dx-select-box>

                </div>

                <!-- Row: Patient Name and Mobile No. -->
                <div style="display: flex; gap: 5px; align-items: flex-start">
                  <!-- Patient Name -->
                  <div style="display: flex; gap: 5px; width: 300px">
                    <dx-text-box
                      #patientBoxRef
                      label="Patient Name"
                      labelMode="floating"
                      [(value)]="invoiceFormData.PATIENT_NAME"
                      [width]="300"
                      (onInput)="onPatientNameInput($event)"
                      (onKeyDown)="onKeyDownHandler($event, 'mobileBoxRef')"
                    >
                      <dx-validator>
                        <dxi-validation-rule
                          type="required"
                          message="Patient Name is required"
                        ></dxi-validation-rule>
                      </dx-validator>
                    </dx-text-box>
                  </div>

                  <!-- Mobile No. -->
                  <dx-text-box
                    #mobileBoxRef
                    label="Mobile No."
                    labelMode="floating"
                    [width]="200"
                    [(value)]="invoiceFormData.PATIENT_MOBILE"
                    (onInput)="onMobileInput($event)"
                    (onBlur)="onMobileBlur()"
                    [isValid]="mobileValid"
                    [validationStatus]="(mobileValid || !mobileTouched) ? 'valid' : 'invalid'"
                    [validationMessageMode]="'always'"
                    [validationError]="
                      !mobileValid ? { message: 'Enter a 10 digit number' } : null
                    "
                    [elementAttr]="{ maxlength: 10 }"
                    (onKeyDown)="onKeyDownMobile($event)"
                    (onKeyDown)="onKeyDownHandler($event, 'uhidBoxRef')"
                  >
                    <!-- <dx-validator>
                      <dxi-validation-rule
                        type="required"
                        message="Mobile No. is required"
                      ></dxi-validation-rule>
                    </dx-validator> -->
                  </dx-text-box>
                </div>
              </div>
            </dxi-item>

            <dxi-item location="after" locateInMenu="auto">
              <div class="stacked-toolbar-group"></div>
            </dxi-item>
            <dxi-item location="after" locateInMenu="auto">
              <div
                class="stacked-toolbar-group"
                style="display: flex; flex-direction: column; gap: 5px"
              >
                <!-- Date Box -->
                <dx-text-box
                  #uhidBoxRef
                  label="UHID"
                  labelMode="floating"
                  [(value)]="invoiceFormData.UHID"
                  [width]="205"
                  (onKeyDown)="onKeyDownHandler($event, 'ageBoxRef')"
                  (onInput)="restrictUHIDLength($event)"
                >
                  <dx-validator>
                    <dxi-validation-rule
                      type="required"
                      message="UHID is required"
                    ></dxi-validation-rule>
                        <!-- <dxi-validation-rule
      type="custom"
      [validationCallback]="validateUhid"
      message="UHID must be 11 digits and start with a valid year (e.g. 2025)"
    ></dxi-validation-rule> -->

                  </dx-validator>
                </dx-text-box>

                <!-- Ward and Unit below, with gap -->
                <div style="display: flex; gap: 5px">
                  <dx-number-box
                    #ageBoxRef
                    label="Age"
                    [min]="0"
                    labelMode="floating"
                    [(value)]="invoiceFormData.PATIENT_AGE"
                    [width]="100"
                    (onKeyDown)="onKeyDownHandler($event, 'sexBoxRef')"
                    (onInput)="preventNonNumeric($event)"
                  >
                    <dx-validator>
                      <dxi-validation-rule
                        type="required"
                        message="Age is required"
                      ></dxi-validation-rule>
                      <dxi-validation-rule
      type="custom"
      [validationCallback]="ageNotZero"
      message="Age cannot be zero"
    ></dxi-validation-rule>
                    </dx-validator>
                  </dx-number-box>

                  <dx-select-box
                    #sexBoxRef
                    label="Sex"
                    labelMode="floating"
                    [(value)]="invoiceFormData.PATIENT_SEX"
                    [width]="100"
                    [dataSource]="sexOptions"
                    displayExpr="name"
                    valueExpr="name"
                    (onKeyDown)="onSexKeyDown($event)"
                  >
                    <dx-validator>
                      <dxi-validation-rule
                        type="required"
                        message="Sex is required"
                      ></dxi-validation-rule>
                    </dx-validator>
                  </dx-select-box>
                </div>
              </div>
            </dxi-item>
          </dxo-toolbar>
          <dxi-column dataField="ITEM_ID" caption="Item">
            <dxo-lookup
              [dataSource]="items"
              displayExpr="DESCRIPTION"
              valueExpr="ID"
            ></dxo-lookup>
          </dxi-column>

          <dxi-column
            dataField="ITEM_NAME"
            caption="Item Description"
          ></dxi-column>
          <dxi-column
            dataField="QUANTITY"
            caption="Quantity"
            dataType="number"
            [format]="{ type: 'fixedPoint', precision: 2 }"
            [editorOptions]="{ format: '#,##0.00' }"
          ></dxi-column>

          <dxi-column
            dataField="PRICE"
            caption="Unit Price"
            [format]="{ type: 'fixedPoint', precision: 2 }"
            dataType="number"
            [editorOptions]="{ format: '#,##0.00' }"
          ></dxi-column>
          <dxi-column
            dataField="AMOUNT"
            caption="Total"
            [format]="{ type: 'fixedPoint', precision: 2 }"
            dataType="number"
            [editorOptions]="{ format: '#,##0.00' }"
            [calculateCellValue]="calculateAmount"
          ></dxi-column>
  <dxi-column type="buttons">
    <dxi-button name="edit"></dxi-button>
    <dxi-button name="delete"></dxi-button>
  </dxi-column>
          <dxo-summary>
            <dxi-total-item
              name="AMOUNT"
              column="AMOUNT"
              summaryType="sum"
              [valueFormat]="customFormat"
              displayFormat="Gross Amount: {0}"
              alignment="right"
              showInColumn="AMOUNT"
            >
            </dxi-total-item>
          </dxo-summary>
        </dx-data-grid>

        <div
          style="
            display: flex;
            flex-direction: column;
            gap: 5px;
            margin-top: 5px;
          "
        >
          <!-- Row 1: Schema + Schema % | Scheme Amount + Net Amount -->
          <div style="display: flex; justify-content: space-between; gap: 10px">
            <!-- Left -->
            <div style="display: flex; gap: 5px">
              <dx-select-box
                #schemaSelect
                label="Schema"
                labelMode="floating"
                [dataSource]="schemaOptions"
                displayExpr="SCHEMA_NAME"
                [(value)]="invoiceFormData.SCHEMA_ID"
                valueExpr="ID"
                [searchEnabled]="true"
                [width]="200"
                [showClearButton]="true"
                (onValueChanged)="onSchemaChanged($event)"
              ></dx-select-box>
              <dx-text-box
                label="Schema%"
                labelMode="floating"
                [width]="100"
                [(value)]="invoiceFormData.SCHEMA_PERCENT"
              ></dx-text-box>
            </div>
            <!-- Right -->
            <div style="display: flex; gap: 5px">
              <dx-text-box
                [readOnly]="true"
                label="Schema Amount"
                labelMode="floating"
                [(value)]="invoiceFormData.SCHEMA_AMOUNT"
                [width]="200"
              ></dx-text-box>
              <dx-number-box
                label="Net Amount"
                labelMode="floating"
                [(value)]="invoiceFormData.NET_AMOUNT"
                [width]="200"
                [format]="{
                  type: 'fixedPoint',
                  precision: 2,
                  useGrouping: true
                }"
                [inputAttr]="{
                  style:
                    'font-weight: bold; font-size: 18px; text-align: right;'
                }"
              ></dx-number-box>
            </div>
          </div>

          <!-- Row 2: Payment Options + Insurance | Buttons -->
          <div
            style="
              display: flex;
              justify-content: space-between;
              gap: 10px;
              align-items: flex-end;
            "
          >
            <!-- Left side: payment + insurance -->
            <div style="display: flex; gap: 10px">
              <dx-select-box
                #paymentModeSelect
                label="Payment Options"
                labelMode="floating"
                [dataSource]="paymentModes"
                displayExpr="DESCRIPTION"
                valueExpr="ID"
                [(value)]="invoiceFormData.PAYMENT_MODE"
                [width]="200"
                [searchEnabled]="true"
                [(value)]="selectedPaymentModeId"
                (onValueChanged)="onPaymentModeChange($event)"
              >
                <dx-validator>
                  <dxi-validation-rule
                    type="required"
                    message="Please select payment mode"
                  ></dxi-validation-rule>
                </dx-validator>
              </dx-select-box>

              <dx-select-box
                *ngIf="selectedPaymentModeId === creditModeId"
                #insuranceSelect
                label="Insurance"
                labelMode="floating"
                [dataSource]="insuranceOptions"
                displayExpr="DESCRIPTION"
                valueExpr="ID"
                [(value)]="invoiceFormData.INSURANCE_ID"
                [searchEnabled]="true"
                [width]="200"
              ></dx-select-box>
              <dx-text-box
                *ngIf="selectedPaymentModeId === creditModeId"
                #insuranceNumberSelect
                label="Insurance No."
                labelMode="floating"
          [(value)]="invoiceFormData.INSURANCE_NO"
       (onKeyDown)="onKeyDownHandler($event, 'saveButton')"
                [width]="200"
              ></dx-text-box>
            </div>

            <!-- Right side: Buttons -->
            <div style="display: flex; gap: 10px">
              <!-- <dx-button text="Print" stylingMode="outlined" type="default"></dx-button> -->
              <dx-button
                text="Clear"
                stylingMode="outlined"
                type="normal"
                (onClick)="cancel()"
              ></dx-button>
              <dx-button
              #saveButton
                text="Save"
                stylingMode="contained"
                type="default"
                (onClick)="showConfirm()"
              ></dx-button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</dx-validation-group>



<dx-popup
  [(visible)]="confirmVisible"
  [showTitle]="true"
  [title]="'Confirm Save'"
  [width]="350"
  [height]="180"
  [dragEnabled]="false"
  [closeOnOutsideClick]="false"
  (onShown)="focusYesButton()"
>
  <p style="padding: 10px; text-align:left;">
    Are you sure want to save invoice?
  </p>
<div style="text-align: right; padding-right: 10px;">
  <dx-button 
    text="Yes" 
    stylingMode="contained" 
    type="default" 
    (onClick)="onConfirm(true)">
  </dx-button>

  <dx-button 
    text="No" 
    stylingMode="contained" 
    type="normal" 
    (onClick)="onConfirm(false)" 
    style="margin-left: 10px;">
  </dx-button>
</div>

</dx-popup>



<!-- PRINT POPUP -->
<dx-popup
  [(visible)]="printConfirmVisible"
  [showTitle]="true"
  title="Print Invoice"
  [width]="300"
  [height]="170"
  [dragEnabled]="false"
  [showCloseButton]="false"
  [closeOnOutsideClick]="false"
>
  <div class="popup-body">
    <p>Do you want to print the invoice?</p>

    <div class="popup-footer">
      <dx-button
        text="No"
        type="normal"
        stylingMode="outlined"
        (onClick)="onConfirmPrint('no')"
      ></dx-button>
      <!-- <dx-button
        text="Print"
        type="default"
        stylingMode="contained"
        (onClick)="onConfirmPrint('print')"
      ></dx-button> -->
      <dx-button
        text="Print & Preview"
        type="default"
        stylingMode="contained"
        (onClick)="onConfirmPrint('Print & Preview')"
      ></dx-button>
      
      
    </div>
   
  </div>
</dx-popup>
