<div class="view-wrapper list-page">
  <dx-data-grid
    #gridRef
    id="dataGrid"
    #dataGrid
    [dataSource]="dataSource"
    [width]="'100%'"
    [height]="'90vh'"
    [showBorders]="true"
    [showColumnLines]="false"
    [rowAlternationEnabled]="true"
    [columnAutoWidth]="true"
    (onEditingStart)="onEditingStart($event)"
     (onRowRemoved)="deleteData($event)"
   [loadPanel]="{ enabled: true, text: 'Loading...', showIndicator: true, showPane: true }"
    [elementAttr]="{ class: 'custom-popup' }"
    [pager]="{
      showInfo: true,
      infoText: 'Page {0} of {1}',
      showNavigationButtons: true
    }"
  >
    <dxo-scrolling mode="standard"></dxo-scrolling>
    <!-- export -->
    <dxo-export
      [enabled]="true"
      [formats]="['xlsx', 'pdf']"
    >
    </dxo-export>

    <dxo-search-panel
      [visible]="true"
      [highlightCaseSensitive]="true"
    ></dxo-search-panel>

    <dxo-paging></dxo-paging>
    <dxo-pager
      [visible]="true"
      [showPageSizeSelector]="true"
      [allowedPageSizes]="[10, 20, 30, 40]"
    ></dxo-pager>


<dxo-filter-row [visible]="showFilterRow" [applyFilter]="currentFilter"></dxo-filter-row>

    <dxo-header-filter [visible]="true">
      <dxo-search [enabled]="true"></dxo-search>
    </dxo-header-filter>

    <dxo-editing
      mode="popup"
      [allowUpdating]="isDeleteIconVisible"
      [allowDeleting]="isDeleteIconVisible"
      [allowAdding]="true"
      [useIcons]="true"
    >
      <dxo-popup
        title="Employee Info"
        [showTitle]="true"
        [width]="800"
        [height]="700"
        [showCloseButton]="true"
      >
      </dxo-popup>
    </dxo-editing>

    <dxo-toolbar>
      <dxi-item
        location="before"
        text="Users"
      ></dxi-item>

      <dxi-item location="after" locateInMenu="auto">
        <dx-button
          icon="plus"
          type="default"
          stylingMode="contained"
          (onClick)="openPopup()"
        ></dx-button>
      </dxi-item>
    </dxo-toolbar>
 
    <dxi-column
      dataField="SlNo"
      [width]="80"
      caption="Sl.No"
      [allowEditing]="false"
      alignment="left"
    >
      
    </dxi-column>
    <dxi-column dataField="USER_NAME" caption="User Name"></dxi-column>
    <dxi-column dataField="LOGIN_NAME" caption="Login Name"></dxi-column>
    
    <dxi-column
      dataField="IS_INACTIVE"
      caption="Status"
      cellTemplate="statusCellTemplate"
    ></dxi-column>
    <div *dxTemplate="let cellData of 'statusCellTemplate'">
      <i
        class="fas fa-flag"
        [ngClass]="getStatusFlagClass(cellData.value)"
        [attr.title]="cellData.value"
        style="margin-left: 10px; cursor: default;"
      ></i>
    </div>
  </dx-data-grid>
</div>

<!-- ======================Add User=================== -->
<dx-popup
  [(visible)]="addPopup"
  [width]="460"
  height="550"
  title="New User"
  [shading]="false"
  [showCloseButton]="true"
  (onHiding)="onAddPopupClose()"
  [shading]="true"               
  [hideOnOutsideClick]="false"
>
  <!-- INPUT FIELD -->
  <dx-form [formGroup]="formsource">
    <dxi-item class="fields">
      <dx-text-box
        type="text"
        formControlName="UserName"
        class="form-control mt-1"
        label="UserName"
        labelMode="floating"></dx-text-box>
    </dxi-item>
    <dxi-item class="fields">
      <dx-text-box
        type="text"
        formControlName="LoginName"
        class="form-control mt-1"
        label="LoginName"
        labelMode="floating"
      ></dx-text-box>
    </dxi-item>


    <dxi-item

      [editorOptions]="{ mode: 'password' }"
    >
    <dx-text-box
        formControlName="LoginPassword"
        label="Password"
        labelMode="floating"
        class="form-control mt-1"
        [height]="35"
        [inputAttr]="{ autocomplete: 'new-password' }"
        [mode]="passwordMode"
        [buttons]="[
        {
          name: 'togglePassword',
          location: 'after',
          options: {
            icon: passwordMode === 'password' ? 'fas fa-eye' : 'fas fa-eye-slash',
            stylingMode: 'text',
            onClick: togglePasswordVisibility
          }
        }
      ]">
        <!-- <dx-validator>
        <dxi-validation-rule type="required" message="Password is required"></dxi-validation-rule>
      </dx-validator> -->
      </dx-text-box>
    </dxi-item>

    <dxi-item

      [editorOptions]="{ mode: 'password' }"
    >
    
      <dx-text-box
        [mode]="confirmPasswordMode"
        formControlName="ConfirmPassword"
        label="Confirm Password"
        labelMode="floating"
        class="form-control mt-1"
        [height]="35"
        [buttons]="[
        {
          name: 'togglePassword',
          location: 'after',
          options: {
            icon: confirmPasswordMode === 'password' ? 'fas fa-eye' : 'fas fa-eye-slash',
            stylingMode: 'text',
            onClick: toggleConfirmPasswordVisibility
          }
        }
      ]"
      >
    </dx-text-box>
    </dxi-item>
   
<dxi-item class="checkbox-row" >

      <dx-check-box
        class="mt-1"
        formControlName="AddInvoice"
        [elementAttr]="{ 'aria-label': 'Unchecked' }"
        id="checboxadd"
      ></dx-check-box>
<label for="checboxadd" class="me-3" >Can Add Invoice</label>
      
      <dx-check-box
        class="mt-1"
        formControlName="ViewInvoice"
        [elementAttr]="{ 'aria-label': 'Unchecked' }"
        id="checboxadd"
      ></dx-check-box>
<label for="checboxadd" class="me-3" >Can View Invoice</label>
      
      <dx-check-box
        class="mt-1"
        formControlName="CancelInvoice"
        [elementAttr]="{ 'aria-label': 'Unchecked' }"
        id="checboxadd"
      ></dx-check-box>
      <label for="checboxadd" class="me-3" >Can Cancel Invoice</label>
      </dxi-item>
    
    <!-- DROPDOWN ROLES -->
    <dxi-item > 
      <dx-select-box
        [items]="UserType"
        label="UserType"
        labelMode="floating"
        alignment="center"
        [(value)]="selectedUserType"
        formControlName="UserType"
        valueExpr="ID"
        displayExpr="DESCRIPTION"
        [items]="usertype_list"
        (onChange)="onUserTypeChange($event)"
      >
      </dx-select-box
    ></dxi-item>


     <!-- DROPDOWN HOSPITAL -->

    <!-- Hospital Dropdown (Visible Only When "Hospital" is Selected) -->
    <dxi-item>
      <dx-select-box
        [showClearButton]="true"
        [visible]="selectedUserType===3 || selectedUserType===4"
        [items]="hospital_list"
        valueExpr="ID"
        [(value)]="selectedHospitalId"
        
        displayExpr="DESCRIPTION"
        label="Select Hospital"
        labelMode="floating"
        labelLocation="left"
        [showSelectionControls]="true"
        applyValueMode="instantly"
        [searchEnabled]="true"
        formControlName="HospitalId"
       (onValueChanged)="onHospitalValue($event)"
      >
      </dx-select-box>
    </dxi-item>



    <!-- DROPDOWN DEPARTMENt -->

    <!-- Department Dropdown (Visible Only When "Hospital" is Selected) -->
    <dxi-item>
      <dx-select-box
        [showClearButton]="true"
        [visible]="selectedUserType===4"
        [items]="department_list"
        valueExpr="ID"
        [(value)]="selectedDepartmentId"
        displayExpr="DESCRIPTION"
        label="Select Department"
        labelMode="floating"
        labelLocation="left"
        [showSelectionControls]="true"
        applyValueMode="instantly"
        [searchEnabled]="true"
        formControlName="DepartmentId"
        
      >
      </dx-select-box>
    </dxi-item>
    

    <!-- BUTTONS -->
   <dxi-item class="d-flex justify-content-end mt-1">
            <button class="btn me-1 text-dark border border-1 equal-button" (click)="closePop()">
              Cancel
            </button>
            <dx-button class="equal-button" text="Save" type="default" stylingMode="contained" (onClick)="addData()"></dx-button>
          </dxi-item>
  </dx-form>
</dx-popup>

<!-- ===================Update User========== -->
<dx-popup
  [title]="'Edit User'"
  [(visible)]="editPopup"
  [width]="500"
  height="620"
  [closeOnOutsideClick]="false"
  [showCloseButton]="true"
  [shading]="false"
  (onHidden)="closePop()"
  [shading]="true"               
  [hideOnOutsideClick]="false"
>
  <!-- INPUT FIELD -->
  <dx-form [formGroup]="formsource">
    <dxi-item class="fields" >
      <dx-text-box formControlName="UserName" class="mt-1" label="UserName" labelMode="floating"></dx-text-box
    ></dxi-item>
    <dxi-item>
      <dx-text-box formControlName="LoginName" class="mt-1" label="LoginName" labelMode="floating"></dx-text-box
    ></dxi-item>

    <dxi-item
      [editorOptions]="{ mode: 'password' }"
    >
    <dx-text-box
        formControlName="LoginPassword"
        label="Password"
        labelMode="floating"
        class="form-control mt-1"
        [height]="35"
        [inputAttr]="{ autocomplete: 'new-password' }"
        [mode]="passwordMode"
        [buttons]="[
        {
          name: 'togglePassword',
          location: 'after',
          options: {
            icon: passwordMode === 'password' ? 'fas fa-eye' : 'fas fa-eye-slash',
            stylingMode: 'text',
            onClick: togglePasswordVisibility
          }
        }
      ]">
        <!-- <dx-validator>
        <dxi-validation-rule type="required" message="Password is required"></dxi-validation-rule>
      </dx-validator> -->
      </dx-text-box>
    </dxi-item>

   <dxi-item
      [editorOptions]="{ mode: 'password' }"
    >
    
      <dx-text-box
        [mode]="confirmPasswordMode"
        formControlName="ConfirmPassword"
        label="Confirm Password"
        labelMode="floating"
        class="form-control mt-1"
        [height]="35"
        [buttons]="[
        {
          name: 'togglePassword',
          location: 'after',
          options: {
            icon: confirmPasswordMode === 'password' ? 'fas fa-eye' : 'fas fa-eye-slash',
            stylingMode: 'text',
            onClick: toggleConfirmPasswordVisibility
          }
        }
      ]"
      >
    </dx-text-box>
    </dxi-item>
   

   <!-- ACTIVE CHECKBOX -->
<dxi-item>
<label for="checboxadd" class="me-5" >Inactive</label>
      <dx-check-box
        class="mt-1"
        formControlName="Inactive"
        [elementAttr]="{ 'aria-label': 'Unchecked' }"
        id="checboxadd"
      ></dx-check-box>
      </dxi-item>
      
<dxi-item class="checkbox-row">
      <dx-check-box
        class="mt-2"
        formControlName="AddInvoice"
        [elementAttr]="{ 'aria-label': 'Unchecked' }"
        id="checboxadd"
      ></dx-check-box>
      <label for="checboxadd" class="me-2" > Can Add Invoice</label>

      <dx-check-box
        class="mt-2"
        formControlName="ViewInvoice"
        [elementAttr]="{ 'aria-label': 'Unchecked' }"
        id="checboxadd"
      ></dx-check-box>
      <label for="checboxadd" class="me-2" >Can View Invoice</label>

      
      <dx-check-box
        class="mt-2"
        formControlName="CancelInvoice"
        [elementAttr]="{ 'aria-label': 'Unchecked' }"
        id="checboxadd"
      ></dx-check-box>
      <label for="checboxadd" class="me-2" > Can Cancel Invoice</label>
      </dxi-item>

    <!-- DROPDOWN ROLES -->
    <dxi-item>
      <dx-select-box
        [items]="UserType"
        class="mt-1"
        alignment="center"
        label="UserType"
        labelMode="floating"
        [(value)]="user_Id_value"
        valueExpr="ID"
        displayExpr="DESCRIPTION"
        [items]="usertype_list"
        (onChange)="onUserTypeChange($event)"
      >
      </dx-select-box     
    ></dxi-item>
 <!-- DROPDOWN HOSPITAL -->
    <dxi-item>
      <dx-select-box
        [visible]="user_Id_value==3 || user_Id_value===4"
        dataField="Hospital"
        [items]="hospital_list"
        valueExpr="ID"
        [(value)]="selectedHospitalId"
        displayExpr="DESCRIPTION"
        label="Select Hospital"
        labelMode="floating"
        labelLocation="left"
        [showSelectionControls]="true"
        applyValueMode="instantly"
        [searchEnabled]="true"
          (onValueChanged)="onHospitalValue($event)"
      >
      </dx-select-box>
    </dxi-item>
    <!-- DROPDOWN DEPARTMENT -->
    <dxi-item>
      <dx-select-box
        [visible]="user_Id_value==4 "
        dataField="Department"
        [items]="department_list"
        valueExpr="ID"
        [(value)]="selectedDepartmentId"
        displayExpr="DESCRIPTION"
        label="Select Department"
        labelMode="floating"
        labelLocation="left"
        [showSelectionControls]="true"
        applyValueMode="instantly"
        [searchEnabled]="true"
        
      >
      </dx-select-box>
    </dxi-item>


    

    <!-- BUTTONS -->
     <dxi-item class="d-flex justify-content-end mt-3">
            <button class="btn me-1 text-dark border border-1 equal-button" (click)="closePop()">
              Cancel
            </button>
            <dx-button class="equal-button" text="Update" type="default" stylingMode="contained" (onClick)="editData()"></dx-button>
          </dxi-item>
  </dx-form>
</dx-popup>
